workflows:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. VNC / Manual Setup Session
  #    Start this workflow when you need to SSH or screen-share into the Mac
  #    build machine to perform one-time setup (e.g. add GoogleService-Info.plist,
  #    sign in to Xcode, install a tool).  The machine idles for 30 minutes then
  #    the build ends automatically.
  # ─────────────────────────────────────────────────────────────────────────────
  manual-setup-session:
    name: Manual Setup Session (VNC)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Hold the machine open for manual setup via VNC
        script: |
          echo "Machine is up. Connect via VNC now and do your manual setup."
          echo "This will idle for 30 minutes, then the build ends on its own."
          sleep 1800

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. iOS Simulator Build  (no code signing needed)
  #    Builds the .app for the iOS Simulator so you can verify the project
  #    compiles cleanly on a real Mac / Xcode environment without a certificate.
  #
  #    HOW TO TRIGGER:
  #      Codemagic dashboard → Start new build → choose this workflow.
  #
  #    IMPORTANT – GoogleService-Info.plist:
  #      This file contains Firebase secrets and must NOT be committed to git.
  #      Before running this workflow, either:
  #        a) Add it as a Codemagic "Environment file" variable named
  #           GOOGLE_SERVICE_INFO_PLIST (base-64 encoded), OR
  #        b) Run the manual-setup-session first and place the file manually.
  #      The script below handles option (a) automatically.
  # ─────────────────────────────────────────────────────────────────────────────
  simulator-native-ios:
    name: EmergencyReady iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "EmergencyReady.xcodeproj"
        XCODE_SCHEME: "EmergencyReady"
        # Optional: set GOOGLE_SERVICE_INFO_PLIST in Codemagic as a secret
        # file variable (base-64). The script below decodes and places it.
    scripts:
      - name: Inject GoogleService-Info.plist (if provided as env variable)
        script: |
          PLIST_PATH="$CM_BUILD_DIR/EmergencyReady/GoogleService-Info.plist"
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST_PATH"
            echo "Real GoogleService-Info.plist injected from environment variable."
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST env var set."
            echo "Using the stub GoogleService-Info.plist already present in the repo."
            echo "Firebase features will not work, but the build will compile."
          fi

      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme  "$XCODE_SCHEME"

      - name: Build the .app for iOS Simulator (no code signing needed)
        script: |
          xcodebuild build \
            -project      "$XCODE_PROJECT"  \
            -scheme       "$XCODE_SCHEME"   \
            -sdk          iphonesimulator   \
            -destination  'platform=iOS Simulator,name=iPhone 15 Pro' \
            -configuration Debug            \
            CODE_SIGN_IDENTITY=""           \
            CODE_SIGNING_REQUIRED=NO        \
            CODE_SIGNING_ALLOWED=NO         \
            | tee /tmp/xcodebuild.log       \
            | xcpretty --color || (cat /tmp/xcodebuild.log && exit 1)

    artifacts:
      # Raw xcodebuild log (always saved, useful when xcpretty suppresses details)
      - /tmp/xcodebuild.log
      # The compiled .app bundle
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
